name: Enviar mensaje de cumpleaños - Familia Cuenca

on:
  schedule:
    - cron: '0 8 * * *'  # Todos los días a las 08:00 UTC
  workflow_dispatch:       # Permite ejecutarlo manualmente desde GitHub

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Descargar el repositorio
      - uses: actions/checkout@v3

      # 2️⃣ Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3️⃣ Instalar dependencias
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # 4️⃣ Crear archivo config.py con credenciales de Twilio
      - name: Configurar variables de entorno
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: |
          echo "TWILIO_ACCOUNT_SID = '${TWILIO_ACCOUNT_SID}'" > config.py
          echo "TWILIO_AUTH_TOKEN = '${TWILIO_AUTH_TOKEN}'" >> config.py
          echo "TWILIO_WHATSAPP_NUMBER = 'whatsapp:+14155238886'" >> config.py
          echo "WHATSAPP_GROUP_NUMBER = 'whatsapp:+521XXXXXXXXXX'" >> config.py

      # 5️⃣ Ejecutar el script de envío
      - name: Ejecutar script
        run: python send_whatsapp.py
